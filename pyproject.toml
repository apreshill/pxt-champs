[project]
name = "pxt-champs"
version = "0.1.0"
description = "Beta-tester quickstart for Pixeltable cloud-hosted tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.22.1",
    "pixeltable-yolox>=0.4.2",
    "pixeltable[serve]==0.7.12",
]

[[tool.pixeltable.database]]
